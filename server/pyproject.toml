[project]
name = "mtglog"
version = "0.1.0.dev0"
description = "会議音声のローカル文字起こしサーバー"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "numpy>=1.26",
    "onnxruntime>=1.19",
    "faster-whisper>=1.1",
]

[project.optional-dependencies]
# WSL で GPU を使うときの CUDA ライブラリ（Docker のイメージには含まれる）
cuda = [
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12>=9,<10",
]

[project.scripts]
mtglog = "mtglog.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.7", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mtglog"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: 実モデルと GPU を使う結合テスト（MTGLOG_GPU_TESTS=1 のときだけ実行）"]

[tool.ruff]
line-length = 120
target-version = "py312"
